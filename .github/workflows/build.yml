name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 wixl
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CapsSwitch
          path: |
            build/CapsSwitch.msi
            build/CapsSwitch.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/CapsSwitch.msi
            build/CapsSwitch.exe
